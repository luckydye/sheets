# https://taskfile.dev

version: "3"

tasks:
  default:
    silent: true
    cmd: task -l --sort none

  setup:
    desc: "Install JS dependencies"
    cmd: bun install --frozen-lockfile

  dev:
    desc: "Run the Tauri app in development (hot-reloading frontend)"
    deps: [setup]
    cmd: bun run tauri dev

  build:
    desc: "Build a native app bundle"
    deps: [setup]
    cmds:
      - bun run tauri build
      - '{{if eq OS "darwin"}}./scripts/sign-macos.sh{{else}}true{{end}}'

  sign:
    desc: "Re-sign the built macOS bundle and refresh its file associations"
    cmd: ./scripts/sign-macos.sh

  install:
    desc: "Build and install Sheets.app into /Applications"
    deps: [build]
    cmds:
      - rm -rf /Applications/Sheets.app
      - cp -R src-tauri/target/release/bundle/macos/Sheets.app /Applications/
      - ./scripts/sign-macos.sh /Applications/Sheets.app

  web:
    desc: "Run just the Vite frontend in a browser (no native shell)"
    deps: [setup]
    cmd: bun run dev

  vendor:
    desc: "Rebuild the vendored IronCalc wasm + UI from source (tag v0.7.1)"
    cmd: ./scripts/build-ironcalc.sh
