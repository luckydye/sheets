[package]
name = "sheets"
version = "0.1.0"
description = "A minimal offline table editor built on IronCalc"
authors = ["you"]
edition = "2021"

[lib]
name = "sheets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironcalc = "=0.7.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
